<path d="M174,60 Q182,65 190,60" fill="none"/>
</g>
<g transform="rotate(-12 95 105)">
<rect x="40" y="70" width="116" height="74" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="98" y="101" font-size="15" text-anchor="middle">우리 딸래미가</text>
<text x="98" y="125" font-size="15" text-anchor="middle">최고다</text>
</g>
<path d="M150,128 q14,-4 18,6 q-4,10 -18,6 z" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<use href="#heart" x="30" y="30"/><use href="#heart" x="120" y="22"/><use href="#heart" x="212" y="96"/>

<!-- (나) 반찬 가게 -->
<g stroke="#000" stroke-width="1.2">
<rect x="262" y="26" width="200" height="30" fill="#dfeaf6"/>
<rect x="262" y="56" width="200" height="112" fill="#ffffff"/>
<rect x="276" y="68" width="98" height="92" fill="#ffffff" stroke-width="1.5"/>
<rect x="384" y="68" width="66" height="92" fill="#eeeeee"/>
<line x1="395" y1="68" x2="395" y2="160" stroke-width="0.8"/>
<line x1="406" y1="68" x2="406" y2="160" stroke-width="0.8"/>
<line x1="417" y1="68" x2="417" y2="160" stroke-width="0.8"/>
<line x1="428" y1="68" x2="428" y2="160" stroke-width="0.8"/>
<line x1="439" y1="68" x2="439" y2="160" stroke-width="0.8"/>
<ellipse cx="417" cy="140" rx="24" ry="8" fill="#ffffff"/>
</g>
<text x="362" y="47" font-size="17" text-anchor="middle" letter-spacing="6">우리 반찬</text>
<text x="325" y="95" font-size="14" text-anchor="middle">맛있는</text>
<text x="325" y="120" font-size="14" text-anchor="middle">낚지볶음</text>
<text x="325" y="145" font-size="14" text-anchor="middle">있습니다.</text>

<!-- (다) 스마트폰 스포츠 뉴스 -->
<g stroke="#000" stroke-width="1.2">
<path d="M30,354 L30,300 Q28,286 44,284 L56,282" fill="#ffffff"/>
<rect x="62" y="194" width="112" height="152" rx="12" fill="#ffffff" stroke-width="1.5"/>
<rect x="70" y="210" width="96" height="118" fill="#f4f7fb" stroke-width="0.8"/>
<rect x="70" y="210" width="96" height="18" fill="#dfeaf6" stroke-width="0.8"/>
<circle cx="118" cy="337" r="4" fill="#ffffff" stroke-width="0.8"/>
<path d="M174,300 q10,0 10,10 l0,20 q0,8 -10,8" fill="#ffffff"/>
</g>
<text x="118" y="223" font-size="10" text-anchor="middle">스포츠 뉴스</text>
<text x="118" y="246" font-size="11" text-anchor="middle">국가 대표 팀,</text>
<text x="118" y="262" font-size="11" text-anchor="middle">무서운 기세로</text>
<text x="118" y="278" font-size="11" text-anchor="middle">상대 팀을</text>
<text x="118" y="294" font-size="11" text-anchor="middle">밀어부치다!</text>
<text x="118" y="318" font-size="8.5" text-anchor="middle">김○○ 기자</text>
<g stroke="#000" stroke-width="1" fill="none">
<line x1="188" y1="226" x2="204" y2="214"/><line x1="190" y1="240" x2="210" y2="238"/><line x1="44" y1="226" x2="28" y2="214"/>
</g>

<!-- (라) 응원 현수막 -->
<g stroke="#000" stroke-width="1.2" fill="#ffffff">
<circle cx="292" cy="226" r="14"/><circle cx="361" cy="220" r="14"/><circle cx="430" cy="226" r="14"/>
<path d="M272,268 Q292,242 312,268"/><path d="M341,262 Q361,236 381,262"/><path d="M410,268 Q430,242 450,268"/>
<rect x="258" y="262" width="206" height="78" fill="#fffbe8" stroke-width="1.5"/>
</g>
<text x="361" y="288" font-size="15" text-anchor="middle">우리가 있으니</text>
<text x="361" y="311" font-size="15" text-anchor="middle">걱정할 꺼 없어!</text>
<text x="361" y="331" font-size="10" text-anchor="middle">- ○○ 팬클럽 일동 -</text>
<use href="#heart" x="262" y="276"/><use href="#heart" x="446" y="300"/>
</svg>
