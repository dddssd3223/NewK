<svg xmlns="http://www.w3.org/2000/svg" width="480" height="356" viewBox="0 0 480 356">
<defs>
<path id="heart" d="M0,3 C0,-2 6,-3 7,1 C8,-3 14,-2 14,3 C14,8 7,11 7,14 C7,11 0,8 0,3 Z" fill="#ffffff" stroke="#000" stroke-width="1"/>
</defs>
<!-- 칸 테두리 -->
<g fill="none" stroke="#000" stroke-width="1">
<rect x="2" y="2" width="234" height="172" rx="4"/>
<rect x="244" y="2" width="234" height="172" rx="4"/>
<rect x="2" y="182" width="234" height="172" rx="4"/>
<rect x="244" y="182" width="234" height="172" rx="4"/>
</g>
<g font-size="12"><text x="9" y="18">(가)</text><text x="251" y="18">(나)</text><text x="9" y="198">(다)</text><text x="251" y="198">(라)</text></g>

<!-- (가) 손팻말을 든 사람 -->
<g stroke="#000" stroke-width="1.2" fill="#ffffff">
<circle cx="182" cy="48" r="17"/>
<path d="M150,170 L154,100 Q182,78 210,100 L214,170"/>
<rect x="166" y="44" width="12" height="7" rx="2" fill="none" stroke-width="1"/>
<rect x="186" y="44" width="12" height="7" rx="2" fill="none" stroke-width="1"/>
